# Generate-Architectures: push/PR은 자동 테스트만, 아키텍처 설계 분석은 사용자가 수동 요청할 때만 실행
name: AWS 아키텍처 검토 자동화

# 1. 트리거: push/PR은 CI 검증, workflow_dispatch는 사용자가 명시적으로 설계 생성
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      analysis_goal:
        description: "분석 목적 (신규 AWS 구축 / 온프레미스 AWS 이전 사전검토)"
        type: choice
        required: true
        options: [new_aws, migrate_onprem]
        default: new_aws
      workload:
        description: "분석할 워크로드 유형"
        type: choice
        required: true
        options: [auto, web, backend, mobile]
        default: auto
      requirements_file:
        description: "선택: 저장소 내부 요구사항 JSON 파일 경로"
        type: string
        required: false
      monthly_budget_usd:
        description: "선택: 월 예산 입력(USD, 실측 비용 아님)"
        type: string
        required: false
      enable_ai:
        description: "외부 OpenAI API로 비기밀 집계 단서를 전송하고 AI 보조 검토 실행 (명시 동의)"
        type: boolean
        required: true
        default: false
      ai_model:
        description: "AI 모델 (OPENAI_API_KEY Secret 필요)"
        type: string
        required: false
        default: gpt-6-luna
      cost_input:
        description: "선택: 저장소 안 비기밀 월 사용량 JSON (미입력은 미산정)"
        type: string
        required: false
      capacity_evidence:
        description: "선택: 집계 부하 테스트(JSON) 검토, 실제 AWS 부하/계정 조회 없음"
        type: string
        required: false
      alternative_cost_input:
        description: "선택: ECS/EC2/Lambda 동일 업무량 비교 JSON 경로 (기본 비활성화)"
        type: string
        required: false
      live_pricing:
        description: "선택: AWS Price List Query API 조회 (권한 필요, 기본 비활성화)"
        type: boolean
        required: true
        default: false
      golden_qa:
        description: "선택: 가상 대표 프로젝트 10종의 오프라인 시각 QA 아티팩트 생성"
        type: boolean
        required: true
        default: false

# 2. 기본 권한: 소스 분석/테스트 작업은 읽기 전용만 허용
permissions:
  contents: read

# 3. 작업 흐름: 의존성 준비 -> 테스트(상시) -> [수동 실행 시에만] 설계 생성 및 보관
jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 3-1. 분석 대상 저장소 체크아웃 (Git 자격정보를 남기지 않음)
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 3-2. 단위 테스트에도 다이어그램 엔진이 필요
      - name: Graphviz 설치
        run: sudo apt-get update -qq && sudo apt-get install -y graphviz fonts-noto-cjk

      # 3-3. AWS 서비스 아이콘 생성에 필요한 고정 버전의 라이브러리 설치
      - name: 렌더링 의존성 설치
        run: python3 -m pip install --disable-pip-version-check -r requirements-diagrams.txt

      # 3-4. 함수 호출과 API 경로를 AST로 분석하는 TypeScript/JavaScript 파서
      # 대상 프로젝트 코드는 실행하지 않으며 설치 시 후크도 차단합니다.
      - name: 코드 구조 분석용 Babel 파서 설치
        run: npm install --prefix scripts/js_analyzer --ignore-scripts --no-audit --no-fund --package-lock=false

      # 3-5. 설계 규칙·코드 그래프·요구사항 검증·AWS 아이콘 생성 테스트
      - name: 자동 테스트
        run: python3 -m unittest discover -s tests -v

      # 3-6. push/PR에서는 코드 품질검사만 실행. 사용자의 수동 요청에서만 전체 설계 분석을 수행
      # 기존 CI 자동 검증을 유지하면서 모델 호출과 분석 리소스 낭비를 줄입니다.
      - name: 설계 분석 및 다이어그램 생성 (수동 실행)
        if: github.event_name == 'workflow_dispatch'
        uses: ./
        with:
          workload: ${{ inputs.workload || 'auto' }}
          analysis_goal: ${{ inputs.analysis_goal || 'new_aws' }}
          requirements_file: ${{ inputs.requirements_file || '' }}
          monthly_budget_usd: ${{ inputs.monthly_budget_usd || '' }}
          # PR/push 자동 실행에서는 항상 AI 사용 안 함: 사용자 동의 없이 외부 정보 전송 금지
          enable_ai: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_ai || false }}
          ai_model: ${{ inputs.ai_model || 'gpt-6-luna' }}
          # 비용 산정은 사용자가 입력한 사용량만 활용하며 누락 단가는 추정하지 않습니다.
          cost_input: ${{ inputs.cost_input || '' }}
          alternative_cost_input: ${{ inputs.alternative_cost_input || '' }}
          capacity_evidence: ${{ inputs.capacity_evidence || '' }}
          live_pricing: ${{ github.event_name == 'workflow_dispatch' && inputs.live_pricing || false }}
        env:
          # Secrets는 수동 실행에서 동의한 경우에만 노출; 일반 PR은 비활성화
          OPENAI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_ai && secrets.OPENAI_API_KEY || '' }}

      # 3-7. 사용자가 수동으로 설계 생성을 요청한 경우에만 Artifact 보관
      # push/PR은 분석을 생성하지 않으므로 별도 Artifact도 업로드하지 않습니다.
      - name: 생성 파일 업로드 (수동 실행)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: aws-architecture-recommendation
          path: architecture-output/
          if-no-files-found: error
          retention-days: 30


      # 3-8. 대표 프로젝트 품질 검토는 사용자가 명시적으로 요청했을 때만 생성합니다.
      # 테스트와 다르게 결과 보고서/다이어그램을 사람이 직접 비교할 수 있도록 따로 업로드합니다.
      - name: 대표 프로젝트 10종 시각 QA 자료 생성 (수동 선택)
        if: github.event_name == 'workflow_dispatch' && inputs.golden_qa
        run: python3 tests/generate_golden_artifacts.py --output golden-output

      - name: 골든 프로젝트 결과물 업로드 (수동 선택)
        if: github.event_name == 'workflow_dispatch' && inputs.golden_qa
        uses: actions/upload-artifact@v4
        with:
          name: aws-architecture-golden-fixtures
          path: golden-output/
          if-no-files-found: error
          retention-days: 14
