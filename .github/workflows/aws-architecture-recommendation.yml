name: AWS Architecture Recommendation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pull-requests: write
jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y graphviz
      - name: Generate report
        run: python3 scripts/recommend_architecture.py --repo . --output architecture-output
      - uses: actions/upload-artifact@v4
        with:
          name: aws-architecture-recommendation
          path: architecture-output/
          if-no-files-found: error
          retention-days: 30
      - name: Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- aws-architecture-recommendation -->';
            const body = marker + ' AWS architecture recommendation generated: ' + context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (previous) await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});
