name: AWS Architecture Proposal
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  recommendation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Leegiyeon/Generate-Architectures@main
      - uses: actions/upload-artifact@v4
        with:
          name: aws-architecture-recommendation
          path: architecture-output/
          if-no-files-found: error
