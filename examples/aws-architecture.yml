# 이 파일을 대상 저장소의 .github/workflows/aws-architecture.yml로 복사하세요.
# Actions > AWS Architecture Review > Run workflow에서 목적을 선택하면 됩니다.
name: AWS Architecture Review

on:
  workflow_dispatch:
    inputs:
      analysis_goal:
        description: "무엇을 검토하시나요?"
        type: choice
        required: true
        options:
          - new_aws
          - migrate_onprem
        default: new_aws

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # 실제 운영 적용 전에는 @main 대신 검증된 커밋 SHA/릴리스 태그로 고정하세요.
      - uses: Leegiyeon/Generate-Architectures@main
        with:
          analysis_goal: ${{ inputs.analysis_goal }}
          # 요구사항 파일이 있는 경우에만 사용:
          # requirements_file: .architecture/requirements.json

      - uses: actions/upload-artifact@v4
        with:
          name: aws-architecture-recommendation
          path: architecture-output/
          if-no-files-found: error
          retention-days: 30
