# 다른 GitHub 저장소에서 재사용하는 Composite Action 정의
name: AWS 아키텍처 설계 초안 생성
description: 저장소 근거와 명시적 요구사항을 분석하고 한글 보고서와 AWS 아이콘 다이어그램을 생성합니다 (배포 없음).

# 1. 입력: 워크로드와 사용자 제공 요구사항. 빈 파일 경로는 분석만 진행합니다.
inputs:
  workload:
    description: "auto / web / backend / mobile (auto는 코드 근거로 판단)"
    required: false
    default: auto
  monthly_budget_usd:
    description: "선택 입력: 사용자 월 예산 상한 (실제 AWS 비용 추정치 아님)"
    required: false
    default: ""
  requirements_file:
    description: "선택 입력: 분석 대상 저장소 내부의 JSON 요구사항 파일 경로"
    required: false
    default: ""
  output_dir:
    description: "생성 보고서와 다이어그램을 저장할 위치"
    required: false
    default: architecture-output
  enable_ai:
    description: "명시적 동의 시에만 비기밀 집계 단서를 외부 OpenAI API로 전송 (기본 꺼짐)"
    required: false
    default: "false"
  ai_model:
    description: "Responses API 모델 이름 (API 키는 GitHub Secrets OPENAI_API_KEY로 전달)"
    required: false
    default: gpt-6-luna
  cost_input:
    description: "선택: 저장소 내부 비기밀 비용 사용량 JSON (미입력 시 미산정)"
    required: false
    default: ""
  live_pricing:
    description: "선택: AWS Price List API를 명시적으로 조회 (기본 꺼짐, AWS IAM 권한 필요)"
    required: false
    default: "false"
  terraform_plan:
    description: "선택: 일회성 terraform show -json 파일 경로 (민감 JSON Git 커밋 금지)"
    required: false
    default: ""

# 2. 실행: 수집된 데이터를 외부 AI 서비스로 송신하지 않는 읽기 전용 분석
runs:
  using: composite
  steps:
    # 2-1. AWS 서비스 아이콘과 연결선을 렌더링하기 위한 Graphviz 바이너리
    - name: Graphviz 설치
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y graphviz fonts-noto-cjk

    # 2-2. 고정된 Diagrams 버전으로 실행 환경을 재현
    - name: AWS 아이콘 렌더링 라이브러리 설치
      shell: bash
      env:
        REQUIREMENTS_FILE: ${{ github.action_path }}/requirements-diagrams.txt
      run: python3 -m pip install --disable-pip-version-check -r "$REQUIREMENTS_FILE"

    # 2-3. Node.js는 대상 저장소의 코드를 실행하지 않으며 파서 패키지만 설치합니다.
    # --ignore-scripts로 npm 의존성의 설치 스크립트 실행을 방지합니다.
    - name: TypeScript·JavaScript AST 파서 설치
      shell: bash
      env:
        PARSER_DIR: ${{ github.action_path }}/scripts/js_analyzer
      run: npm install --prefix "$PARSER_DIR" --ignore-scripts --no-audit --no-fund --package-lock=false

    # 2-4. 실시간 AWS 가격 조회를 선택한 경우에만 SDK 의존성을 설치합니다.
    - name: AWS 가격표 조회 SDK 설치 (선택)
      if: inputs.live_pricing == 'true'
      shell: bash
      run: python3 -m pip install --disable-pip-version-check 'boto3==1.40.0'

    # 2-5. GitHub Actions 변수는 환경변수로 전달하여 셸 코드 주입을 방지
    - name: 저장소 분석 및 아키텍처 보고서 생성
      shell: bash
      env:
        INPUT_WORKLOAD: ${{ inputs.workload }}
        INPUT_BUDGET: ${{ inputs.monthly_budget_usd }}
        INPUT_REQUIREMENTS: ${{ inputs.requirements_file }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
        INPUT_AI_ENABLED: ${{ inputs.enable_ai }}
        INPUT_AI_MODEL: ${{ inputs.ai_model }}
        INPUT_COST_FILE: ${{ inputs.cost_input }}
        INPUT_LIVE_PRICING: ${{ inputs.live_pricing }}
        INPUT_TERRAFORM_PLAN: ${{ inputs.terraform_plan }}
        ACTION_SCRIPT: ${{ github.action_path }}/scripts/recommend_architecture.py
      run: |
        set -euo pipefail
        set -- --repo . --output "$INPUT_OUTPUT_DIR" --workload "$INPUT_WORKLOAD"
        if [[ -n "$INPUT_BUDGET" ]]; then
          set -- "$@" --budget "$INPUT_BUDGET"
        fi
        if [[ -n "$INPUT_REQUIREMENTS" ]]; then
          set -- "$@" --requirements "$INPUT_REQUIREMENTS"
        fi
        # 명시적으로 true가 지정된 경우에만 외부 AI 검토 허용
        case "$INPUT_AI_ENABLED" in
          true) set -- "$@" --enable-ai --ai-model "$INPUT_AI_MODEL" ;;
          false) ;;
          *) echo "enable_ai 입력은 true 또는 false만 허용합니다." >&2; exit 2 ;;
        esac
        if [[ -n "$INPUT_COST_FILE" ]]; then
          set -- "$@" --cost-input "$INPUT_COST_FILE"
        fi
        if [[ -n "$INPUT_TERRAFORM_PLAN" ]]; then
          set -- "$@" --terraform-plan "$INPUT_TERRAFORM_PLAN"
        fi
        case "$INPUT_LIVE_PRICING" in
          true) set -- "$@" --live-pricing ;;
          false) ;;
          *) echo "live_pricing은 true 또는 false만 허용합니다." >&2; exit 2 ;;
        esac
        python3 "$ACTION_SCRIPT" "$@"
